name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on:
      - self-hosted
      - tony-shrimp-api
      - prod

    steps:
      - name: Deploy on VPS
        run: |
          set -euo pipefail

          cd /opt/tony-shrimp/tony-shrimp-api
          git fetch origin main
          git pull --ff-only origin main

          docker compose -f docker-compose.prod.yml up -d --build
          docker compose -f docker-compose.prod.yml exec -T api uv run alembic upgrade head

          for attempt in $(seq 1 12); do
            if curl -fsS https://api.tonyshrimp.com.au/health/; then
              exit 0
            fi

            echo "Health check failed, retrying in 5s... ($attempt/12)"
            sleep 5
          done

          echo "API health check failed after retries."
          docker compose -f docker-compose.prod.yml ps
          docker compose -f docker-compose.prod.yml logs --tail=120 api
          docker compose -f docker-compose.prod.yml logs --tail=120 caddy
          exit 1
